name: OhMyOpenClaw
options:
  bundleIdPrefix: run.kandot
  deploymentTarget:
    iOS: '18.0'
packages:
  OhMyOpenClaw:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '9'
targets:
  OhMyOpenClaw:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: OhMyOpenClaw
        product: OhMyOpenClawCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kandot.oh-my-openclaw
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oh My OpenClaw
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: Gateway のセットアップ QR コードを読み取ります。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: メッセージを音声で入力します。音声は端末内で認識します。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 音声を端末内で文字に変換します。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 同じネットワークの OpenClaw Gateway に接続します。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  OhMyOpenClaw:
    build:
      targets:
        OhMyOpenClaw: all
    run:
      config: Debug
